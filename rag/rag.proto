syntax = "proto3";

package rag;

service RagService {
  rpc Ping(RagPingRequest) returns (RagPingReply);
  rpc RegisterUserEmbedding(RegisterUserEmbeddingRequest) returns (RegisterUserEmbeddingReply);
  rpc GetUserEmbeddingRegistry(GetUserEmbeddingRegistryRequest) returns (GetUserEmbeddingRegistryReply);
  rpc RouteQuery(RouteQueryRequest) returns (RouteQueryReply);
  rpc SendEvidence(SendEvidenceRequest) returns (SendEvidenceReply);
}

message RagPingRequest {
  string sender = 1;
}

message RagPingReply {
  string worker_id = 1;
  string status = 2;
}

message RegisterUserEmbeddingRequest {
  string worker_id = 1;
  string advertise_addr = 2;
  repeated double embedding = 3;
  string embedding_model = 4;
  int32 embedding_dimension = 5;
  int32 source_root_count = 6;
  repeated string source_node_ids = 7;
}

message RegisterUserEmbeddingReply {
  string worker_id = 1;
  int32 registered_count = 2;
}

message UserEmbeddingRecord {
  string worker_id = 1;
  string advertise_addr = 2;
  repeated double embedding = 3;
  string embedding_model = 4;
  int32 embedding_dimension = 5;
  int32 source_root_count = 6;
  repeated string source_node_ids = 7;
}

message GetUserEmbeddingRegistryRequest {
  string requester_worker_id = 1;
}

message GetUserEmbeddingRegistryReply {
  string worker_id = 1;
  repeated UserEmbeddingRecord users = 2;
}

message RouteQueryRequest {
  string query_id = 1;
  string query = 2;
  int32 top_k = 3;
  string coordinator_addr = 4;
  int32 curr_hop = 5;
  int32 max_hops = 6;
  repeated string visited_worker_ids = 7;
}

message NodeCandidate {
  string worker_id = 1;
  string node_id = 2;
  string title = 3;
  double score = 4;
  string preview = 5;
  string description = 6;
  string metadata_json = 7;
}

message RouteQueryReply {
  string worker_id = 1;
  repeated NodeCandidate candidates = 2;
}

message Evidence {
  string worker_id = 1;
  string node_id = 2;
  string title = 3;
  string content = 4;
  string metadata_json = 5;
}

message SendEvidenceRequest {
  string query_id = 1;
  repeated Evidence evidence = 2;
}

message SendEvidenceReply {
  string worker_id = 1;
  int32 accepted_count = 2;
}
