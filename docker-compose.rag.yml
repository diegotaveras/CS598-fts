services:

  node1:
    build: .
    env_file:
      - .env
    container_name: rag-node1
    volumes:
      - .:/app
      - ./rag_docs/node1:/data/rag
    ports:
      - "9101:9100"
    environment:
      ROLE: rag_worker
      RAG_WORKER_ID: node1
      RAG_PORT: 9100
      RAG_DOC_DIR: /data/rag
      RAG_NEIGHBORS: node2:9100,node3:9100,node4:9100
      RAG_BOOTSTRAP_QUERY: ${RAG_QUERY:-What is this document about?}
      RAG_BOOTSTRAP_DELAY_SECONDS: ${RAG_BOOTSTRAP_DELAY_SECONDS:-2.0}
      RAG_QUERY_TTL: ${RAG_QUERY_TTL:-1}

  node2:
    build: .
    env_file:
      - .env
    container_name: rag-node2
    volumes:
      - .:/app
      - ./rag_docs/node2:/data/rag
    ports:
      - "9102:9100"
    environment:
      ROLE: rag_worker
      RAG_WORKER_ID: node2
      RAG_PORT: 9100
      RAG_DOC_DIR: /data/rag
      RAG_NEIGHBORS: node1:9100,node3:9100,node4:9100

  node3:
    build: .
    env_file:
      - .env
    container_name: rag-node3
    volumes:
      - .:/app
      - ./rag_docs/node3:/data/rag
    ports:
      - "9103:9100"
    environment:
      ROLE: rag_worker
      RAG_WORKER_ID: node3
      RAG_PORT: 9100
      RAG_DOC_DIR: /data/rag
      RAG_NEIGHBORS: node1:9100,node2:9100,node4:9100

  node4:
    build: .
    env_file:
      - .env
    container_name: rag-node4
    volumes:
      - .:/app
      - ./rag_docs/node4:/data/rag
    ports:
      - "9104:9100"
    environment:
      ROLE: rag_worker
      RAG_WORKER_ID: node4
      RAG_PORT: 9100
      RAG_DOC_DIR: /data/rag
      RAG_NEIGHBORS: node1:9100,node2:9100,node3:9100
