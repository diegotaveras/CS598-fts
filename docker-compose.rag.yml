services:

  node1:
    build: .
    env_file:
      - .env
    container_name: rag-node1
    volumes:
      - .:/app
      - ./rag_docs/node1:/data/rag
      - ./hf_cache/node1:/root/.cache/huggingface
    ports:
      - "9101:9100"
    environment:
      ROLE: rag_worker
      RAG_WORKER_ID: node1
      RAG_PORT: 9100
      RAG_DOC_DIR: /data/rag
      HF_HOME: /root/.cache/huggingface
      RAG_NEIGHBORS: node2:9100,node3:9100,node4:9100
      RAG_FORCE_LEADER_ID: ${RAG_FORCE_LEADER_ID:-node1}
      RAG_BENCHMARK_EVENTS_PATH: /app/benchmarking/events/node1.jsonl
      RAG_BOOTSTRAP_QUERY: ${RAG_QUERY:- What are the dates for the MURAL Festival in Lisbon, and who is the curator?}
      RAG_BOOTSTRAP_DELAY_SECONDS: ${RAG_BOOTSTRAP_DELAY_SECONDS:-2.0}
      # What are the dates for the MURAL Festival in Lisbon, and who is the curator?
      # What significant event marked the rise of digital art platforms post-September 2023
      #How many shares of Apple did they repurchase during 2025

  node2:
